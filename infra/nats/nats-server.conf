# NATS JetStream config — ADR-001 D3, Phase 2 task 2.4
#
# Streams declared declaratively in infra/nats/streams.yaml (created in Phase 2).
# Per-account credentials minted in Phase 2 task 2.4 using `nsc` and stored in
# Vault kv/openclaw/nats/account-seeds/*.

server_name: oc-nats-1

# Client port
listen: 0.0.0.0:4222

# Monitoring endpoint (used by healthcheck; not auth-gated because internal-only)
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream

  # Hard caps to prevent runaway storage. Phase 11 observability raises an
  # alarm if used > 80% of these.
  max_memory_store: 1GB
  max_file_store: 10GB
}

# AES-256-GCM at-rest encryption.
# Phase 2 task 2.4 generates the encryption key, stores it in
# Vault kv/openclaw/nats/encryption-key, and renders it here via vault-agent.
# Until then, this block is commented; data is at-rest plaintext within
# the dm-crypt-mounted volume.
#
# jetstream {
#   ...
#   encryption: {
#     key: $JS_ENCRYPTION_KEY
#   }
# }

# Auth: bootstrap allows local-only nokey access. Phase 2 task 2.4 swaps in
# operator-JWT-based auth via `nsc` and an `accounts` block.
# Until then, the docker network and lack of published port are the access
# boundary.

# Tune for personal scale.
max_connections: 100
max_payload: 8MB
